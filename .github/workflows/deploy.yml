name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Always runs, including on PRs. This is the schema gate: a malformed paper file
  # or an unlisted vocabulary value fails here rather than reaching the site.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Gated on the PUBLISH repo variable so the site stays unpublished until launch.
  # To go live: set PUBLISH=true in Settings → Secrets and variables → Actions → Variables.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
